# There is no devenv.lock in this tree and this file does not invent one: the
# lock is the driver's to create from this input.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/c2f38fe7f9e04d9aadd354d380f2bd40531d9737